# Publica la base de datos y las funciones de servidor en Supabase
# cada vez que cambia algo dentro de supabase/ en la rama main.
# También se puede correr a mano: pestaña Actions → "Publicar en Supabase" → Run workflow.
name: Publicar en Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency: supabase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_YES: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar herramientas
        run: npm ci

      - name: Revisar que estén los secretos
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Faltan estos secretos en GitHub (Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi

      - name: Vincular el proyecto de Supabase
        run: npx supabase link --project-ref "$PROJECT_REF" --yes

      - name: Marcar como instaladas las migraciones que se pegaron a mano (Fases 1 y 2)
        run: |
          npx supabase migration repair --status applied \
            20261120000001 20261120000002 20261120000003 20261121000001 \
            --remote --password="$SUPABASE_DB_PASSWORD" --yes

      - name: Aplicar migraciones nuevas
        run: npx supabase db push --remote --password="$SUPABASE_DB_PASSWORD" --skip-vault --yes

      - name: Cargar las claves de Google en las funciones
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ] && [ -n "$APP_URL" ]; then
            npx supabase secrets set GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" APP_URL="$APP_URL" --yes
          else
            echo "::warning::Todavía no están GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET y APP_URL: Google Calendar no va a funcionar hasta cargarlos."
          fi

      - name: Cargar las claves de Meta (Instagram) en las funciones
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_CONFIG_ID: ${{ secrets.META_CONFIG_ID }}
        run: |
          if [ -n "$META_APP_ID" ] && [ -n "$META_APP_SECRET" ] && [ -n "$META_CONFIG_ID" ]; then
            npx supabase secrets set META_APP_ID="$META_APP_ID" META_APP_SECRET="$META_APP_SECRET" META_CONFIG_ID="$META_CONFIG_ID" --yes
          else
            echo "::warning::Todavía no están META_APP_ID, META_APP_SECRET y META_CONFIG_ID: Instagram no va a funcionar hasta cargarlos."
          fi

      - name: Publicar las funciones de servidor
        run: npx supabase functions deploy --use-api --yes
